<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тир - мини-игра</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #2f4f2f, #1a241a);
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 15px 25px;
      z-index: 50;
    }

    .back-btn {
      color: white;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
      backdrop-filter: blur(4px);
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      margin-top: 70px;
      width: 100%;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      letter-spacing: 0.4rem;
      text-transform: uppercase;
    }

    .hud {
      display: flex;
      gap: 1.5rem;
      font-size: clamp(1rem, 2vw, 1.4rem);
    }

    .hud-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    .start-btn,
    .restart-btn {
      border: none;
      background: linear-gradient(135deg, #ff5f3e, #ff9f1a);
      color: #fff;
      font-weight: 600;
      font-size: clamp(1rem, 2vw, 1.2rem);
      padding: 0.8rem 2.8rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .start-btn:hover,
    .restart-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(255, 95, 62, 0.25);
    }

    .start-btn:active,
    .restart-btn:active {
      transform: translateY(-1px);
    }

    .game-wrapper {
      position: relative;
    }

    .game-area {
      position: relative;
      width: min(98vw, 1200px);
      height: min(85vh, 800px);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, transparent 70%),
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.03) 0,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 40px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.03) 0,
          rgba(255, 255, 255, 0.03) 1px,
          transparent 1px,
          transparent 40px
        ),
        #243824;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
      cursor: crosshair;
    }

    .target {
      position: absolute;
      width: clamp(48px, 8vw, 76px);
      height: clamp(48px, 8vw, 76px);
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0 8%, #ff3333 9% 100%);
      box-shadow: 0 10px 25px rgba(255, 51, 51, 0.4);
      transform: translate(-50%, -50%);
      animation: pop-in 0.18s ease;
    }

    .target::after {
      content: "";
      position: absolute;
      inset: 50%;
      width: 12%;
      height: 12%;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.25);
    }

    .target.hit {
      animation: hit 0.16s ease forwards;
      pointer-events: none;
    }

    .game-over {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: radial-gradient(circle, rgba(15, 20, 15, 0.9), rgba(15, 20, 15, 0.98));
      text-align: center;
    }

    .game-over h2 {
      font-size: clamp(2rem, 6vw, 4rem);
      text-transform: uppercase;
      letter-spacing: 0.6rem;
    }

    .game-over p {
      font-size: clamp(1.2rem, 3vw, 2rem);
    }

    .hidden {
      display: none;
    }

    .hint {
      opacity: 0.6;
      font-size: clamp(0.9rem, 1.6vw, 1rem);
    }

    @keyframes pop-in {
      from {
        transform: translate(-50%, -50%) scale(0.4);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    @keyframes hit {
      to {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="header">
    <a href="index.html" class="back-btn">← Меню</a>
  </div>

  <div class="container">
    <h1>Тир</h1>

    <div class="hud">
      <div class="hud-item">
        Счёт: <span id="score">0</span>
      </div>
      <div class="hud-item">
        Время: <span id="time">30</span> с
      </div>
    </div>

    <button id="startBtn" class="start-btn">Старт</button>

    <div class="game-wrapper">
      <div id="game" class="game-area"></div>

      <div id="gameOver" class="game-over hidden">
        <h2>Игра окончена!</h2>
        <p>Ваш счёт: <span id="finalScore">0</span></p>
        <button id="restartBtn" class="restart-btn">Играть снова</button>
      </div>
    </div>

    <p class="hint">Кликай по мишеням, пока не истекло время!</p>
  </div>

  <script>
    const gameArea = document.getElementById("game");
    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const scoreEl = document.getElementById("score");
    const timeEl = document.getElementById("time");
    const gameOverEl = document.getElementById("gameOver");
    const finalScoreEl = document.getElementById("finalScore");

    let score = 0;
    let timeLeft = 30;
    let timerId = null;
    let spawnId = null;
    let isPlaying = false;

    function resetGame() {
      score = 0;
      timeLeft = 30;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      gameOverEl.classList.add("hidden");
      clearTargets();
    }

    function clearTargets() {
      gameArea.querySelectorAll(".target").forEach((target) => target.remove());
    }

    function startGame() {
      if (isPlaying) return;

      resetGame();
      isPlaying = true;
      startBtn.disabled = true;
      startBtn.textContent = "Игра идёт...";

      timerId = setInterval(() => {
        timeLeft -= 1;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);

      spawnId = setInterval(spawnTarget, 650);

      spawnTarget();
    }

    function endGame() {
      isPlaying = false;
      clearInterval(timerId);
      clearInterval(spawnId);
      clearTargets();

      startBtn.disabled = false;
      startBtn.textContent = "Старт";

      finalScoreEl.textContent = score;
      gameOverEl.classList.remove("hidden");
    }

    function spawnTarget() {
      if (!isPlaying) return;

      const target = document.createElement("div");
      target.classList.add("target");

      const areaRect = gameArea.getBoundingClientRect();
      const targetSize = 76;
      const padding = targetSize / 2;

      const maxX = areaRect.width - padding;
      const maxY = areaRect.height - padding;
      const minX = padding;
      const minY = padding;

      const x = Math.random() * (maxX - minX) + minX;
      const y = Math.random() * (maxY - minY) + minY;

      target.style.left = `${x}px`;
      target.style.top = `${y}px`;

      target.addEventListener("click", handleHit, { once: true });

      const lifeTime = setTimeout(() => {
        if (target.parentElement) {
          target.remove();
        }
      }, 900);

      target.dataset.lifeTime = String(lifeTime);

      gameArea.appendChild(target);
    }

    function handleHit(event) {
      event.stopPropagation();

      const target = event.currentTarget;
      const lifeTime = Number(target.dataset.lifeTime);
      clearTimeout(lifeTime);

      target.classList.add("hit");
      score += 1;
      scoreEl.textContent = score;

      setTimeout(() => {
        target.remove();
      }, 160);
    }

    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
  </script>
</body>

</html>
